<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 8 Flex</title>
    <style>
        div {border:1px solid purple;}
        section {display: flex;} /* this property must go on the row */
        section div {flex: 1;} /* must be on the column */
    </style>
</head>
<body>

<section><!-----This is our flex box row -->
    <div>1</div>
    <div>2</div>
    <div>3</div>
</section>
</body>
</html>
