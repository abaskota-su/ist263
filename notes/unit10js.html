<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        h2 {
            border:2px solid black;
        }
    </style>
    <script>
        function FirstFunction() {
            alert('Hello World');
        }
        function clicky(){
            alert('Thanks For Clicking');
        }
        function Hovery(){
            alert('Thanks For Rolling Over Me!');
        }
    </script>
</head>
<body onload="FirstFunction();">
    <h1>JavaScript Basics</h1>
    <p onclick="clicky();">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quibusdam dignissimos molestiae labore quisquam maxime, adipisci possimus quaerat dolorum modi enim cumque veniam dicta consectetur laudantium ullam perferendis accusamus explicabo numquam!</p>
    <h2 onmouseover="Hovery();">Hover</h2>
    

</body>
</html>
